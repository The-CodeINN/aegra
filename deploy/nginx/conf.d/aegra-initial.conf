# Temporary Nginx config used BEFORE SSL certificates are obtained.
# After certbot issues certs, this is replaced by aegra.conf.

upstream aegra_backend {
    server aegra:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name agent.dedatahub.io;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to app (HTTP only until cert is obtained)
    location / {
        proxy_pass http://aegra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
