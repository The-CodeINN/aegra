[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database or multiple components)
    e2e: End-to-end tests (full system with real database)
    slow: Tests that take more than 1 second
    manual_auth: Manual auth tests (skipped by default, run when auth code changes)
    eval: Golden-conversation replay tests (call a real LLM + external services; run manually or nightly)

# Output options
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    -ra
    --color=yes
    -m "not manual_auth and not eval"

# Asyncio configuration
asyncio_mode = auto

# Coverage options (if using pytest-cov)
# addopts = --cov=src/aegra_api --cov-report=html --cov-report=term-missing
